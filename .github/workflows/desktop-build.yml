name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-windows'

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant Execute Permissions for Gradle
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Build EXE and MSI
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherST-Tunnel-Windows-EXE
          path: composeApp/build/compose/binaries/main-release/exe/*.exe

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherST-Tunnel-Windows-MSI
          path: composeApp/build/compose/binaries/main-release/msi/*.msi

      - name: Create Release (Optional - only on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/compose/binaries/main-release/exe/*.exe
            composeApp/build/compose/binaries/main-release/msi/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
