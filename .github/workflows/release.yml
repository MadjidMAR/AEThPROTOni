name: Build & Release Multi-APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-android'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/src/main
          echo $ENCODED_STRING | base64 --decode > app/src/main/release.jks

      - name: Build Multi-APK with Gradle
        env:
          KEYSTORE_FILE: src/main/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Organize & Rename APKs
        id: rename_apks
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          RELEASE_DIR="${{ github.workspace }}/release-artifacts"
          mkdir -p "$RELEASE_DIR"
          cd app/build/outputs/apk/release/
          
          for apk in *.apk; do
            if [[ "$apk" == *"universal"* ]]; then
              new_name="AetherST-Tunnel-${TAG_NAME}-universal.apk"
            elif [[ "$apk" == *"arm64-v8a"* ]]; then
              new_name="AetherST-Tunnel-${TAG_NAME}-arm64-v8a.apk"
            elif [[ "$apk" == *"armeabi-v7a"* ]]; then
              new_name="AetherST-Tunnel-${TAG_NAME}-armeabi-v7a.apk"
            elif [[ "$apk" == *"x86_64"* ]]; then
              new_name="AetherST-Tunnel-${TAG_NAME}-x86_64.apk"
            else
              new_name="AetherST-Tunnel-${TAG_NAME}-$(echo $apk | rev | cut -d'-' -f2 | rev).apk"
            fi
            cp "$apk" "$RELEASE_DIR/$new_name"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Sensitive Data
        if: always()
        run: rm -f app/src/main/release.jks
